repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        # Strict type-checking on the pure-Python backend layers only.
        # UI (PySide6) and numpy stubs are too incomplete for strict mode.
        args: [--strict, --ignore-missing-imports]
        files: ^video_annotator/(models|controllers|utils)/
        additional_dependencies:
          - numpy
